name: Build
on:
  push:
    branches:
    - master
    - release-*
  pull_request:
    types:
    - opened
    - edited
    - reopened
    - synchronize
  pull_request_target:
    types:
    - labeled

jobs:
  build:
    if: ${{ github.repository == 'gardener/gardener-extension-shoot-networking-filter' && (github.event_name != 'pull_request_target' || (github.event_name == 'pull_request_target' && github.event.label.name == 'reviewed/ok-to-test')) }}
    uses: ./.github/workflows/build.yaml
    with:
      mode: snapshot
    secrets: inherit
    permissions:
      contents: write
      packages: write
      id-token: write

  component-descriptor:
    if: github.repository == 'gardener/gardener-extension-shoot-networking-filter'
    uses: gardener/cc-utils/.github/workflows/post-build.yaml@master
    needs:
      - build
    secrets: inherit
    permissions:
      id-token: write
      contents: write
